[project]
name = "vizlify-backend"
version = "0.1.0"
description = "Vizlify API — the approval-gated money agent for freelance agencies"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.143",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22",
    "httpx>=0.28",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "ruff>=0.17",
]

# Application, not a distributable library.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
